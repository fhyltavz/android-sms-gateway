# Weekly: is there a new capcom6/android-sms-gateway release? If yes, merge it into a branch
# (our MyQR changes and our .github stay as they are) and open a pull request for Ping to approve.
# If the merge has conflicts, or Actions may not open pull requests here, an issue is opened instead.
name: Check capcom6 updates

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 09:00 Manila
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Latest capcom6 release
        id: up
        run: |
          TAG=$(gh api repos/capcom6/android-sms-gateway/releases/latest --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git fetch --no-tags https://github.com/capcom6/android-sms-gateway "refs/tags/$TAG:refs/tags/upstream-$TAG"
          if git merge-base --is-ancestor "upstream-$TAG" HEAD; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "Already on $TAG"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          BR="upstream/$TAG"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin "refs/heads/$BR" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Merge into a branch
        id: merge
        if: steps.up.outputs.new == 'true' && steps.up.outputs.exists == 'false'
        run: |
          TAG="${{ steps.up.outputs.tag }}"; BR="${{ steps.up.outputs.branch }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git merge --no-commit --no-ff "upstream-$TAG" || true
          # Keep our workflows exactly: drop upstream's workflow edits and additions.
          for f in $(git diff --name-only --diff-filter=U -- .github); do git rm -q -f "$f" 2>/dev/null || true; done
          git checkout HEAD -- .github 2>/dev/null || true
          for f in $(git diff --cached --name-only --diff-filter=A HEAD -- .github); do git rm -q -f "$f"; done
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            exit 0
          fi
          git commit -q -m "Merge capcom6 SMSGate $TAG"
          # GitHub refuses pushes from Actions that bring in commits touching workflow files; then hand it to an issue.
          if git push -q origin "$BR"; then echo "conflicts=false" >> "$GITHUB_OUTPUT"; else echo "upstream commits change workflow files, so Actions may not push them" > conflicts.txt; echo "conflicts=true" >> "$GITHUB_OUTPUT"; fi

      - name: Pull request (or issue)
        if: steps.merge.outputs.conflicts == 'false'
        run: |
          TAG="${{ steps.up.outputs.tag }}"; BR="${{ steps.up.outputs.branch }}"
          BODY="capcom6 released SMSGate $TAG (https://github.com/capcom6/android-sms-gateway/releases/tag/$TAG). This branch merges it; our MyQR changes and workflows are kept. A test APK build is started for this branch (Actions tab). Merge when it looks good, then make a release with Run workflow > release_tag."
          if gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BR" --title "Update to capcom6 SMSGate $TAG" --body "$BODY"; then :; else
            gh issue create --title "capcom6 SMSGate $TAG is ready to merge" --body "$BODY Open the pull request here: https://github.com/${{ github.repository }}/compare/$BR?expand=1 (Actions isn't allowed to open pull requests in this repo)."
          fi
          gh workflow run myqr-apk.yml --ref "$BR" || true

      - name: Issue on conflicts
        if: steps.merge.outputs.conflicts == 'true'
        run: |
          TAG="${{ steps.up.outputs.tag }}"
          gh issue create --title "capcom6 SMSGate $TAG needs a manual merge" --body "Merging $TAG could not be done automatically: $(tr '\n' ' ' < conflicts.txt). Ask Claude to merge it."
