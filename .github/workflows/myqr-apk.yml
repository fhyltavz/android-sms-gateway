# MyQR SMS Sender: builds the APK.
# - Every push to a claude/* or main/master branch, or "Run workflow": a test APK as a run artifact.
# - A tag v*, or "Run workflow" with release_tag: the APK attached to a GitHub Release, also as myqr-sms-sender.apk so
#   https://github.com/fhyltavz/android-sms-gateway/releases/latest/download/myqr-sms-sender.apk always works.
#   Signed when the secrets below exist, else a debug-signed TEST build.
# Signing secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEY_STORE_BASE64, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD, SIGNING_STORE_PASSWORD
# Without them the APK is debug-signed (fine for testing; phones must uninstall before a signed build).
name: MyQR SMS Sender APK

on:
  push:
    branches: [master, main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Make a GitHub Release with this tag (for example v0.1.0); empty = artifact only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Version
        id: ver
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then V="${TAG#v}"; else V="0.$(date +%y%m%d).${GITHUB_RUN_NUMBER}-test"; fi
          CODE=$(( ($(date +%s) - $(date -d "2026-11-01" +%s)) / 600 ))
          sed -i "s/versionName .*/versionName \"$V\"/" app/build.gradle
          sed -i "s/versionCode .*/versionCode $CODE/" app/build.gradle
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Keystore
        id: sign
        env:
          KS: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/keystore.jks; echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "myqr-sms-sender-${{ steps.ver.outputs.name }}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "myqr-sms-sender-${{ steps.ver.outputs.name }}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: myqr-sms-sender-${{ steps.ver.outputs.name }}
          path: myqr-sms-sender-*.apk

      - name: GitHub Release
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp myqr-sms-sender-*.apk myqr-sms-sender.apk
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then NOTE="Signed release."; else NOTE="TEST build (debug signature). Uninstall it before installing a signed release."; fi
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" myqr-sms-sender-*.apk myqr-sms-sender.apk --target "$GITHUB_SHA" --title "MyQR SMS Sender $TAG" --notes "$NOTE Install on Android - download the APK, allow installs from your browser, open it. Download page https://sms.myqrnfc.com/app"
