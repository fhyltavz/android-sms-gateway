# MyQR SMS Sender: builds the APK.
# - Every push to a claude/* or main/master branch, or "Run workflow": a test APK as a run artifact.
# - A tag v*: a signed release APK attached to a GitHub Release (needs the signing secrets below).
# Signing secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEY_STORE_BASE64, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD, SIGNING_STORE_PASSWORD
# Without them the APK is debug-signed (fine for testing; phones must uninstall before a signed build).
name: MyQR SMS Sender APK

on:
  push:
    branches: [master, main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.$(date +%y%m%d).${GITHUB_RUN_NUMBER}-test"; fi
          CODE=$(( ($(date +%s) - $(date -d "2026-11-01" +%s)) / 600 ))
          sed -i "s/versionName .*/versionName \"$V\"/" app/build.gradle
          sed -i "s/versionCode .*/versionCode $CODE/" app/build.gradle
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Keystore
        id: sign
        env:
          KS: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/keystore.jks; echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "myqr-sms-sender-${{ steps.ver.outputs.name }}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "myqr-sms-sender-${{ steps.ver.outputs.name }}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: myqr-sms-sender-${{ steps.ver.outputs.name }}
          path: myqr-sms-sender-*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" myqr-sms-sender-*.apk --title "MyQR SMS Sender $GITHUB_REF_NAME" --notes "Install on Android - download the APK, allow installs from your browser, open it."
